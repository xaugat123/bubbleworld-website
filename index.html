<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubble World • Bubble Tea, Coffee & Ice Cream</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
    
    body { font-family: 'Poppins', sans-serif; }
    
    /* Pouring Animation Container */
    .pour-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }
    
    .glass {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 280px;
      height: 520px;
      background: linear-gradient(transparent, #f8e1e1);
      border: 18px solid #fff;
      border-radius: 50% 50% 40% 40%;
      box-shadow: 0 0 60px rgba(0,0,0,0.3),
                  inset 0 0 40px rgba(255,255,255,0.6);
      overflow: hidden;
    }
    
    .liquid {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0%;
      background: linear-gradient(#ff99cc, #ff66aa);
      transition: height 0.1s linear;
      box-shadow: inset 0 10px 20px rgba(255,255,255,0.4);
    }
    
    .boba {
      position: absolute;
      width: 22px;
      height: 22px;
      background: #3a2a1f;
      border-radius: 50%;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      opacity: 0;
    }
  </style>
</head>
<body class="bg-gradient-to-b from-pink-50 to-purple-50 text-gray-800">

  <!-- Pouring Background -->
  <div class="pour-container">
    <div class="glass">
      <div id="liquid" class="liquid"></div>
      <!-- Boba pearls will be added by JS -->
    </div>
  </div>

  <!-- Navbar -->
  <nav class="bg-white/90 backdrop-blur-md shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="text-4xl">🧋</div>
        <h1 class="text-4xl font-bold tracking-tighter bg-gradient-to-r from-pink-500 to-purple-600 bg-clip-text text-transparent">Bubble World</h1>
      </div>
      <div class="hidden md:flex gap-8 text-lg font-medium">
        <a href="#menu" class="hover:text-pink-500 transition">Menu</a>
        <a href="#locations" class="hover:text-pink-500 transition">6 Locations</a>
        <a href="#" class="hover:text-pink-500 transition">Order Now</a>
      </div>
      <button class="bg-gradient-to-r from-pink-500 to-purple-600 text-white px-8 py-3 rounded-full font-semibold hover:scale-105 transition">
        Order Online
      </button>
    </div>
  </nav>

  <!-- Hero -->
  <section class="min-h-screen flex items-center justify-center text-center px-6 relative">
    <div class="max-w-4xl mx-auto pt-20">
      <h2 class="text-6xl md:text-7xl font-bold mb-6 leading-tight">
        Freshly Poured.<br>
        <span class="bg-gradient-to-r from-pink-500 via-purple-500 to-violet-500 bg-clip-text text-transparent">Always Amazing.</span>
      </h2>
      <p class="text-2xl text-gray-600 mb-10">Premium Bubble Tea • Rolled Ice Cream • Açaí Bowls</p>
      
      <div class="flex gap-4 justify-center">
        <a href="#menu" class="bg-white shadow-xl text-pink-600 px-10 py-5 rounded-3xl text-xl font-semibold hover:scale-105 transition">Explore Menu</a>
        <a href="#locations" class="border-2 border-white text-white px-10 py-5 rounded-3xl text-xl font-semibold hover:bg-white/10 transition">Find Locations</a>
      </div>
    </div>
  </section>

  <!-- Rest of the site continues normally (Menu, Locations, etc.) -->
  <section id="menu" class="py-24 bg-white">
    <div class="max-w-7xl mx-auto px-6">
      <h2 class="text-5xl font-bold text-center mb-16">Our Menu</h2>
      <!-- Your existing menu cards go here -->
      <p class="text-center text-xl">Scroll more to watch the glass fill up completely! 🧋</p>
    </div>
  </section>

  <script>
    const liquid = document.getElementById('liquid');
    
    function updatePour() {
      const scrollY = window.scrollY;
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      let fillPercent = (scrollY / maxScroll) * 100;
      
      // Cap between 10% and 95%
      fillPercent = Math.max(15, Math.min(95, fillPercent));
      liquid.style.height = fillPercent + '%';
      
      // Add boba pearls dynamically as it fills
      if (fillPercent > 30 && !document.getElementById('boba1')) {
        createBoba(60, 80);
        createBoba(120, 70);
        createBoba(190, 85);
      }
    }
    
    function createBoba(left, bottom) {
      const boba = document.createElement('div');
      boba.className = 'boba';
      boba.style.left = left + 'px';
      boba.style.bottom = bottom + '%';
      boba.id = 'boba' + Math.random().toString(36).substr(2, 5);
      document.querySelector('.glass').appendChild(boba);
      
      setTimeout(() => {
        boba.style.opacity = '0.9';
        boba.style.transform = 'translateY(0)';
      }, 100);
    }
    
    window.addEventListener('scroll', updatePour);
    window.addEventListener('load', updatePour);
  </script>
</body>
</html>
