<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubble World • Taro Milk Tea</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
    
    body { font-family: 'Poppins', sans-serif; overflow-x: hidden; }

    .pour-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100vh;
      z-index: -1;
      background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.5)), 
                  url('taro-splash.png') center/cover no-repeat;
      background-attachment: fixed;
    }

    .glass {
      position: absolute;
      bottom: 12%;
      left: 8%;
      width: 260px;
      height: 520px;
      border: 22px solid rgba(255,255,255,0.95);
      border-radius: 50% 50% 38% 38%;
      box-shadow: 0 25px 60px rgba(0,0,0,0.45),
                  inset 0 0 50px rgba(255,255,255,0.7);
      overflow: hidden;
    }

    .liquid {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%;
      height: 0%;
      background: linear-gradient(to top, #9f5ed4, #c38be8, #e0b8f5);
      transition: height 0.1s linear;
    }
  </style>
</head>
<body class="bg-gradient-to-b from-pink-50 to-purple-50">

  <div class="pour-container">
    <div class="glass" id="glass">
      <div id="liquid" class="liquid"></div>
    </div>
  </div>

  <!-- Navbar + Hero same as before -->
  <nav class="bg-white/95 backdrop-blur-md shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-4xl">🧋</span>
        <h1 class="text-4xl font-bold bg-gradient-to-r from-pink-500 to-purple-600 bg-clip-text text-transparent">Bubble World</h1>
      </div>
      <button onclick="alert('Coming soon!')" class="bg-gradient-to-r from-pink-500 to-purple-600 text-white px-8 py-3.5 rounded-3xl font-semibold">
        Order Taro Milk Tea
      </button>
    </div>
  </nav>

  <section class="min-h-screen flex items-center justify-center text-center px-6">
    <div class="max-w-3xl">
      <h2 class="text-6xl md:text-7xl font-bold text-white drop-shadow-2xl">Scroll to Pour<br>Signature Taro Milk Tea</h2>
    </div>
  </section>

  <script>
    const liquid = document.getElementById('liquid');
    window.addEventListener('scroll', () => {
      const scrollY = window.scrollY;
      const max = document.documentElement.scrollHeight - window.innerHeight;
      liquid.style.height = Math.min(98, Math.max(15, (scrollY / max) * 100)) + '%';
    });
  </script>
</body>
</html>
