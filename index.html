<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubble World • Taro Milk Tea</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
    
    body { 
      font-family: 'Poppins', sans-serif; 
      overflow-x: hidden;
    }

    .pour-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100vh;
      z-index: -1;
      overflow: hidden;
      background: linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.45)), 
                  url('https://i.imgur.com/5ux4E.png') center/cover no-repeat; /* ← Change this */
      background-attachment: fixed;
    }

    .glass {
      position: absolute;
      bottom: 12%;
      left: 8%;
      width: 260px;
      height: 520px;
      border: 22px solid rgba(255,255,255,0.95);
      border-radius: 50% 50% 38% 38%;
      box-shadow: 0 25px 60px rgba(0,0,0,0.45),
                  inset 0 0 50px rgba(255,255,255,0.7);
      overflow: hidden;
      background: #f8e1e1;
    }

    .liquid {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%;
      height: 0%;
      background: linear-gradient(to top, #9f5ed4, #c38be8, #e0b8f5);
      transition: height 0.1s linear;
      box-shadow: inset 0 20px 30px rgba(255,255,255,0.6);
    }

    .splash {
      position: absolute;
      background: rgba(255,255,255,0.9);
      border-radius: 50%;
      box-shadow: 0 0 18px #d8a8f0;
      animation: splashAnim 1.4s ease-out forwards;
    }

    @keyframes splashAnim {
      0% { transform: scale(0.6) translateY(0); opacity: 1; }
      100% { transform: scale(0.2) translateY(-160px); opacity: 0; }
    }
  </style>
</head>
<body class="bg-gradient-to-b from-pink-50 to-purple-50">

  <!-- Background with your image -->
  <div class="pour-container" id="pourContainer">
    <div class="glass" id="glass">
      <div id="liquid" class="liquid"></div>
    </div>
  </div>

  <!-- Navbar -->
  <nav class="bg-white/95 backdrop-blur-md shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-4xl">🧋</span>
        <h1 class="text-4xl font-bold tracking-tight bg-gradient-to-r from-pink-500 to-purple-600 bg-clip-text text-transparent">Bubble World</h1>
      </div>
      <button onclick="alert('Online ordering coming soon!')" 
              class="bg-gradient-to-r from-pink-500 to-purple-600 text-white px-8 py-3.5 rounded-3xl font-semibold hover:scale-105 transition">
        Order Taro Milk Tea
      </button>
    </div>
  </nav>

  <!-- Hero -->
  <section class="min-h-screen flex items-center justify-center text-center px-6 relative">
    <div class="max-w-3xl mx-auto pt-16">
      <h2 class="text-6xl md:text-7xl font-bold leading-tight mb-6 text-white drop-shadow-2xl">
        Scroll to Pour<br>
        <span class="bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">Signature Taro Milk Tea</span>
      </h2>
      <p class="text-xl text-white/90 drop-shadow-md">Watch the creamy taro milk tea pour and splash — just like the real thing!</p>
    </div>
  </section>

  <script>
    const liquid = document.getElementById('liquid');
    const glass = document.getElementById('glass');

    function updatePour() {
      const scrollY = window.scrollY;
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      let fill = Math.max(15, Math.min(98, (scrollY / maxScroll) * 100));
      
      liquid.style.height = fill + '%';

      if (fill > 25 && Math.random() > 0.55) createSplash();
      if (fill > 45 && Math.random() > 0.7) createBoba();
    }

    function createSplash() {
      const splash = document.createElement('div');
      splash.className = 'splash';
      splash.style.width = (14 + Math.random() * 22) + 'px';
      splash.style.height = splash.style.width;
      splash.style.left = (32 + Math.random() * 36) + '%';
      splash.style.bottom = (25 + Math.random() * 45) + '%';
      glass.appendChild(splash);
      setTimeout(() => splash.remove(), 1600);
    }

    function createBoba() {
      const boba = document.createElement('div');
      boba.style.cssText = `position:absolute; width:20px; height:20px; background:#2c1f17; border-radius:50%; 
                            left:${32 + Math.random()*36}%; bottom:${15 + Math.random()*55}%; box-shadow:0 4px 8px rgba(0,0,0,0.5);`;
      glass.appendChild(boba);
      setTimeout(() => { boba.style.transition = 'transform 3.5s'; boba.style.transform = 'translateY(-70px)'; }, 100);
      setTimeout(() => boba.remove(), 4500);
    }

    window.addEventListener('scroll', updatePour);
    window.addEventListener('load', () => {
      updatePour();
      setTimeout(createSplash, 800);
    });
  </script>
</body>
</html>
